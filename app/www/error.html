<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Hub</title>
<style>
  html,body{margin:0;height:100%;background:#0F1633;color:#fff;font-family:-apple-system,"Poppins",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;text-align:center}
  .card{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .mark{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#1FB264,#2E3FD6);display:flex;align-items:center;justify-content:center}
  h1{margin:8px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  p{margin:0;color:rgba(255,255,255,.6);font-size:14px;line-height:1.5}
  button{margin-top:8px;background:#fff;color:#0F1633;border:0;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:600;font-family:inherit}
  button:active{opacity:.8}
  .foot{margin-top:18px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:500}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="44" height="44"><path d="M23.36 74.66 L48 51.78 L72.64 74.66" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M23.36 49.76 L48 26.88 L72.64 49.76" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Can't reach the Client Hub</h1>
    <p>Your phone looks offline, or the dashboard isn't answering right now. Nothing is lost, your work is saved on the server.</p>
    <button type="button" onclick="location.replace('https://dashboard.socialupgrades.com/')">Try again</button>
    <div class="foot">Social Upgrades</div>
  </div>
  <script>
    // Retry on our own once the network comes back.
    window.addEventListener('online', function(){ location.replace('https://dashboard.socialupgrades.com/'); });
  </script>
</body>
</html>
