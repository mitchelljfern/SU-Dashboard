# Builds the iOS shell and uploads it to TestFlight.
#
# Triggers: push a tag like `ios-v1.0.0`, or run it by hand from the Actions
# tab. The website itself never needs this — web deploys reach the app
# instantly, since the app loads dashboard.socialupgrades.com. Only changes
# under ios/, app/ or capacitor.config.json need a new build.
#
# Secrets (Settings → Secrets and variables → Actions), see docs/ios-app.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD
name: iOS app → TestFlight

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.1 (blank keeps the project's)"
        required: false
        default: ""
      changelog:
        description: "What to test (shown in TestFlight)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Capacitor into the Xcode project
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build, sign and upload
        working-directory: ios
        env:
          CI: "true"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ inputs.version }}
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane ios beta

      - name: Keep the build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ios/build/*.ipa
            ios/build/*.dSYM.zip
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
